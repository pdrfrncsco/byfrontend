# BOLAYETU — Native VPS Nginx site for by-frontend + by-backend
#
# This file is NOT used by Docker. Copy it to the server, e.g.:
#   sudo cp docker/nginx/by-frontend.vps.conf /etc/nginx/sites-available/bolayetu
#   sudo ln -s /etc/nginx/sites-available/bolayetu /etc/nginx/sites-enabled/bolayetu
#   sudo nginx -t && sudo systemctl reload nginx
#
# Prerequisites on the VPS:
#   - Static bundle extracted to /var/www/by-frontend/dist (see
#     docker-compose.prod.yml FRONTEND_DIST_HOST_PATH).
#   - by-backend container published on 127.0.0.1:8000 (see
#     bybackend/docker-compose.prod.yml).
#   - TLS certificates obtained with certbot for the real domain, e.g.:
#       sudo certbot --nginx -d bolayetu.com -d www.bolayetu.com

server {
    listen 80;
    listen [::]:80;
    server_name bolayetu.com www.bolayetu.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bolayetu.com www.bolayetu.com;

    # Managed by certbot — paths are examples, adjust to the issued certificate.
    ssl_certificate /etc/letsencrypt/live/bolayetu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bolayetu.com/privkey.pem;

    root /var/www/by-frontend/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
    client_max_body_size 20m;

    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Server-Sent Events used by notifications and match centre. These
    # connections must not be buffered or cut off by the normal API timeout.
    location ~ ^/api/v1/(notifications/stream/|competitions/matches/[^/]+/stream/) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    # Proxies to the by-backend container, published on loopback only.
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
